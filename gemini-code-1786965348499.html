<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table Learning Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    h1 { margin-bottom: 15px; color: var(--accent); font-size: 1.8rem; }

    /* Navigation Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #000; font-weight: bold; }

    /* Game Containers */
    .game-mode { display: none; width: 100%; max-width: 1200px; }
    .game-mode.active { display: flex; flex-direction: column; align-items: center; }

    /* Mode 1: Drag & Drop Grid */
    .deck-container { display: flex; gap: 10px; margin-bottom: 20px; min-height: 60px; padding: 10px; background: var(--card-bg); border-radius: 8px; width: 100%; justify-content: center; }
    .element-card { width: 50px; height: 50px; background: var(--accent); color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: grab; font-size: 1.1rem; user-select: none; }
    
    .periodic-table { display: grid; grid-template-columns: repeat(18, 1fr); grid-template-rows: repeat(10, 1fr); gap: 4px; width: 100%; overflow-x: auto; padding: 10px; background: var(--card-bg); border-radius: 8px; }
    .slot { width: 100%; aspect-ratio: 1; border: 1px dashed var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; transition: 0.2s; }
    .slot.wrong { background: #ef4444 !important; }
    
    /* Category Colors */
    .slot.correct.nonmetal { background-color: #22c55e; color: #000; }
    .slot.correct.noble { background-color: #a855f7; color: #000; }
    .slot.correct.alkali { background-color: #f97316; color: #000; }
    .slot.correct.alkaline { background-color: #eab308; color: #000; }
    .slot.correct.metalloid { background-color: #06b6d4; color: #000; }
    .slot.correct.halogen { background-color: #ec4899; color: #000; }
    .slot.correct.transition { background-color: #3b82f6; color: #fff; }
    .slot.correct.post-transition { background-color: #64748b; color: #fff; }
    .slot.correct.lanthanide { background-color: #14b8a6; color: #000; }
    .slot.correct.actinide { background-color: #f43f5e; color: #fff; }

    /* Mode 2 & 3 UI */
    .panel { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 500px; text-align: center; }
    .panel h2 { margin-bottom: 15px; }
    .panel input { width: 80%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; margin: 10px 0; text-align: center; font-size: 1.1rem; }
    .panel button { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .hint-box { text-align: left; background: #0f172a; padding: 15px; border-radius: 6px; margin: 15px 0; line-height: 1.6; }
    .feedback { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Periodic Table Master 🧪</h1>

  <!-- Navigation -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('drag')">1. ลากวาง 118 ธาตุ</button>
    <button class="tab-btn" onclick="switchMode('electron')">2. จัดเรียงอิเล็กตรอน</button>
    <button class="tab-btn" onclick="switchMode('detective')">3. สืบจากคำใบ้</button>
  </div>

  <!-- Mode 1: Drag and Drop -->
  <div id="mode-drag" class="game-mode active">
    <div class="deck-container" id="card-deck"></div>
    <div class="periodic-table" id="table-grid"></div>
  </div>

  <!-- Mode 2: Electron Shell -->
  <div id="mode-electron" class="game-mode">
    <div class="panel">
      <h2>จัดเรียงอิเล็กตรอน</h2>
      <p id="electron-target" style="font-size: 1.3rem; margin: 10px 0; color: var(--accent);"></p>
      <p>กรอกจำนวนอิเล็กตรอนแต่ละชั้น (คั่นด้วยเครื่องหมายจุลภาค ,)</p>
      <input type="text" id="electron-input" placeholder="เช่น 2,8,1">
      <br>
      <button onclick="checkElectron()">ตรวจคำตอบ</button>
      <div id="electron-feedback" class="feedback"></div>
    </div>
  </div>

  <!-- Mode 3: Detective -->
  <div id="mode-detective" class="game-mode">
    <div class="panel">
      <h2>สืบหาธาตุปริศนา 🔍</h2>
      <div class="hint-box" id="detective-hints"></div>
      <input type="text" id="detective-input" placeholder="พิมพ์สัญลักษณ์ธาตุ (เช่น Na, Fe)">
      <br>
      <button onclick="checkDetective()">ทายผล</button>
      <button onclick="startDetectiveMode()" style="background:#64748b; color:#fff;">เปลี่ยนข้อ</button>
      <div id="detective-feedback" class="feedback"></div>
    </div>
  </div>

    let deck = [];
    let currentElectronEl = null;
    let currentDetectiveEl = null;

    // ระบบสลับโหมด
    function switchMode(mode) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.game-mode').forEach(m => m.classList.remove('active'));

      if (mode === 'drag') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('mode-drag').classList.add('active');
      } else if (mode === 'electron') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('mode-electron').classList.add('active');
        startElectronMode();
      } else if (mode === 'detective') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('mode-detective').classList.add('active');
        startDetectiveMode();
      }
    }

    // --- โหมด 1: Drag & Drop ---
    function initDragMode() {
      const grid = document.getElementById('table-grid');
      grid.innerHTML = '';

      elementsData.forEach(el => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.number = el.number;
        slot.style.gridColumn = el.group;
        slot.style.gridRow = el.period;

        slot.addEventListener('dragover', e => e.preventDefault());
        slot.addEventListener('drop', e => handleDrop(e, el));
        grid.appendChild(slot);
      });

      deck = [...elementsData].sort(() => Math.random() - 0.5);
      renderHand();
    }

    function renderHand() {
      const container = document.getElementById('card-deck');
      container.innerHTML = '';
      deck.slice(0, 5).forEach(el => {
        const card = document.createElement('div');
        card.className = 'element-card';
        card.draggable = true;
        card.innerText = el.symbol;
        card.addEventListener('dragstart', e => e.dataTransfer.setData('text', el.number));
        container.appendChild(card);
      });
    }

    function handleDrop(e, targetEl) {
      e.preventDefault();
      const draggedNum = parseInt(e.dataTransfer.getData('text'));
      const slot = e.currentTarget;

      if (draggedNum === targetEl.number) {
        slot.innerText = targetEl.symbol;
        slot.classList.add('correct', targetEl.category);
        deck = deck.filter(item => item.number !== draggedNum);
        renderHand();
      } else {
        slot.classList.add('wrong');
        setTimeout(() => slot.classList.remove('wrong'), 800);
      }
    }

    // --- โหมด 2: Electron Shell ---
    function startElectronMode() {
      currentElectronEl = elementsData[Math.floor(Math.random() * 20)]; // เลือกธาตุ 20 ตัวแรก
      document.getElementById('electron-target').innerText = `${currentElectronEl.name} (${currentElectronEl.symbol}) - เลขอะตอม ${currentElectronEl.number}`;
      document.getElementById('electron-input').value = '';
      document.getElementById('electron-feedback').innerText = '';
    }

    function checkElectron() {
      const input = document.getElementById('electron-input').value.split(',').map(n => parseInt(n.trim()));
      const shells = [2, 8, 18, 32];
      let temp = currentElectronEl.number;
      let correct = [];

      for (let cap of shells) {
        if (temp <= 0) break;
        correct.push(Math.min(temp, cap));
        temp -= cap;
      }

      const isRight = JSON.stringify(input) === JSON.stringify(correct);
      const fb = document.getElementById('electron-feedback');
      if (isRight) {
        fb.style.color = '#22c55e';
        fb.innerText = 'ถูกต้อง! 🎉';
        setTimeout(startElectronMode, 1500);
      } else {
        fb.style.color = '#ef4444';
        fb.innerText = `ยังไม่ถูกต้อง (เฉลย: ${correct.join(',')})`;
      }
    }

    // --- โหมด 3: Detective ---
    function startDetectiveMode() {
      currentDetectiveEl = elementsData[Math.floor(Math.random() * elementsData.length)];
      const hintBox = document.getElementById('detective-hints');
      hintBox.innerHTML = `
        📌 <b>คำใบ้ที่ 1:</b> อยู่ในหมู่ ${currentDetectiveEl.group}<br>
        📌 <b>คำใบ้ที่ 2:</b> อยู่ในคาบ ${currentDetectiveEl.period}<br>
        📌 <b>คำใบ้ที่ 3:</b> เป็นธาตุประเภท ${currentDetectiveEl.category}
      `;
      document.getElementById('detective-input').value = '';
      document.getElementById('detective-feedback').innerText = '';
    }

    function checkDetective() {
      const input = document.getElementById('detective-input').value.trim().toLowerCase();
      const fb = document.getElementById('detective-feedback');

      if (input === currentDetectiveEl.symbol.toLowerCase()) {
        fb.style.color = '#22c55e';
        fb.innerText = `ถูกต้อง! ธาตุนี้คือ ${currentDetectiveEl.name} (${currentDetectiveEl.symbol})`;
      } else {
        fb.style.color = '#ef4444';
        fb.innerText = 'ยังไม่ใช่ ลองใหม่อีกครั้ง!';
      }
    }

    // เริ่มต้นเกมเมื่อโหลดหน้าเว็บ
    window.onload = initDragMode;
  </script>
</body>
</html>
